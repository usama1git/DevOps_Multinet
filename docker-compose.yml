services:
  app:
    build: .
    image: bootcamp-api:1.0
    container_name: bootcamp-api
    expose:
      - "5000"
    restart: unless-stopped

  web:
    build: ./nginx-web
    image: my-nginx:1.0
    container_name: web
    ports:
      - "8080:80"
    volumes:
      - ./nginx-web/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
